server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 64k;

  # Look the API up through Docker's DNS on every request (cached 10s), not once at start: a recreated API container
  # gets a new address, and a name resolved once would keep pointing at the old one (502s until a restart).
  # Outside Docker, set this to the platform's resolver.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  # The API trusts X-Real-IP only when TRUST_PROXY=true, i.e. when it is reachable solely through this proxy.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;

  # Note: an add_header inside a location replaces all server-level add_header directives,
  # so each location declares its full header set.
  # Server-sent events: stream through without buffering; keep-alives arrive every 15s.
  location ~ ^/api/cases/[^/]+/stream$ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 1h;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location /api/ {
    proxy_pass $api;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  location ~ ^/api/cases/[^/]+/guide/live$ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 900s;
  }
  location = /healthz { proxy_pass $api; }
  location = /readyz { proxy_pass $api; }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
  }
}
