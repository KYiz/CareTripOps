name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16.8-alpine
        env:
          POSTGRES_DB: caretrip
          POSTGRES_USER: caretrip
          POSTGRES_PASSWORD: caretrip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caretrip -d caretrip"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://caretrip:caretrip@localhost:5432/caretrip
      TEST_REDIS_URL: redis://localhost:6379/15
      MODEL_MODE: mock_llm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrate a fresh database
        run: alembic upgrade head
      - name: Models and migrations agree
        run: alembic check
      - name: Downgrade and upgrade round trip
        run: alembic downgrade base && alembic upgrade head
      - run: python -m compileall -q app
      - name: Tests (integration tests run against the service database)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Type check and build
        run: npm run build
      - run: node --experimental-strip-types --test tests/*.test.mjs

  images-and-browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ADVISOR_EMAILS: advisor@e2e.test
      E2E_ADVISOR_EMAIL: advisor@e2e.test
      # Every browser test signs in from the same container address; production keeps the defaults.
      LOGIN_CODE_LIMIT_PER_IP_PER_HOUR: "1000"
      CASE_CREATE_LIMIT_PER_IP_PER_HOUR: "1000"
    steps:
      - uses: actions/checkout@v4
      - name: Build container images
        run: docker compose -p caretrip build
      - name: Nginx configuration is valid
        run: docker run --rm --add-host api:127.0.0.1 caretrip-web nginx -t
      - name: Start the stack
        run: docker compose -p caretrip up -d --wait
      - name: Browser journeys and WCAG 2.1 AA checks (English and Chinese)
        run: docker compose -p caretrip --profile e2e run --rm -e CI=true e2e
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report
      - name: Service logs
        if: failure()
        run: docker compose -p caretrip logs --tail 200 api worker
